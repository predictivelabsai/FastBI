services:
  fastbi:
    build: .
    ports:
      - "5008:5008"
    environment:
      FASTBI_DB: /data/fastbi.sqlite
      FASTBI_PORT: "5008"
      MODEL_PROVIDER: ${MODEL_PROVIDER:-xai}
      MODEL_NAME: ${MODEL_NAME:-grok-4.5}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      FASTBI_ADMIN_PASSWORD: ${FASTBI_ADMIN_PASSWORD:-}
      FASTBI_SECRET: ${FASTBI_SECRET:-}
    volumes:
      - fastbi-data:/data
volumes:
  fastbi-data:
