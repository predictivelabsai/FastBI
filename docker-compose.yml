services:
  fastbi:
    build: .
    ports:
      - "5008:5008"
    environment:
      FASTBI_DB: /data/fastbi.sqlite
      FASTBI_PORT: "5008"
      MODEL_PROVIDER: ${MODEL_PROVIDER:-xai}
      MODEL_NAME: ${MODEL_NAME:-grok-4.5}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      FASTBI_ADMIN_PASSWORD: ${FASTBI_ADMIN_PASSWORD:-}
      FASTBI_SECRET: ${FASTBI_SECRET:-}
      FASTBI_GRAPH_ENABLED: ${FASTBI_GRAPH_ENABLED:-1}
      FASTBI_GRAPH_AUTOSEED: ${FASTBI_GRAPH_AUTOSEED:-1}
      FASTBI_GRAPH_ADMIN_EMAILS: ${FASTBI_GRAPH_ADMIN_EMAILS:-admin@fastbi.example}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-fastbi-local-change-me}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    volumes:
      - fastbi-data:/data
    depends_on:
      neo4j:
        condition: service_healthy
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-fastbi-local-change-me}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-fastbi-local-change-me}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - fastbi-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER:-neo4j} -p '$${NEO4J_PASSWORD:-fastbi-local-change-me}' 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  fastbi-data:
  fastbi-neo4j-data:
